# Booked token helper — deploy with: npx wrangler deploy  (see README › "Stay signed in")
name = "booked-auth"
main = "index.ts"
compatibility_date = "2025-01-01"

[vars]
GOOGLE_CLIENT_ID = "PASTE-YOUR-CLIENT-ID.apps.googleusercontent.com"
ALLOWED_ORIGIN = "https://YOUR-USER.github.io"
# GOOGLE_CLIENT_SECRET is a secret, not a var:  npx wrangler secret put GOOGLE_CLIENT_SECRET
